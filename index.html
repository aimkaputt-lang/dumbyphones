<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Shut The Box</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Shut The Box">
<meta name="theme-color" content="#2b2439">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<style>
  :root {
    --bg: #3f3552;
    --bg-dark: #2b2439;
    --felt: #8e2f47;
    --felt-light: #9c3a52;
    --wood: #6a4a3f;
    --wood-light: #84604f;
    --wood-dark: #4a332b;
    --tile: #9a817a;
    --tile-edge: #6f5a55;
    --tile-text: #241a1a;
    --btn: #f8f5f3;
    --btn-edge: #c3b7b8;
    --btn-text: #262222;
    --text: #f6efea;
    --muted: #b9adc6;
    --highlight: #f1d7c9;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: radial-gradient(ellipse at 50% 35%, var(--bg) 0%, var(--bg-dark) 100%);
    background-color: var(--bg-dark);
    color: var(--text);
    font-family: "Fredoka", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-user-select: none; user-select: none;
    overscroll-behavior: none;
  }
  #app {
    min-height: 100%;
    padding: calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 16px);
    display: flex; flex-direction: column; align-items: center;
    max-width: 560px; margin: 0 auto;
  }
  .screen { width: 100%; display: none; flex-direction: column; align-items: center; flex: 1; }
  .screen.active { display: flex; }
  h1 { font-size: 36px; font-weight: 700; margin: 28px 0 4px; letter-spacing: .5px; text-shadow: 0 3px 0 rgba(0,0,0,.3); }
  .sub { color: var(--muted); margin: 0 0 28px; text-align: center; font-size: 15px; }
  .card {
    width: 100%; background: rgba(0,0,0,.2); border-radius: 18px; padding: 18px;
    margin-bottom: 14px; border: 1px solid rgba(255,255,255,.07);
  }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: .8px; }
  input {
    width: 100%; font: inherit; font-size: 20px; padding: 12px 14px; border-radius: 12px; border: 2px solid transparent;
    background: #f1e8e4; color: var(--tile-text); outline: none; font-weight: 600;
    -webkit-user-select: text; user-select: text;
  }
  input:focus { border-color: var(--felt-light); }
  #joinCode { text-transform: uppercase; letter-spacing: 6px; text-align: center; }
  button {
    font: inherit; font-weight: 700; font-size: 20px; border: 0; border-radius: 18px; padding: 15px 18px;
    background: var(--btn); color: var(--btn-text); cursor: pointer; width: 100%;
    box-shadow: 0 6px 0 var(--btn-edge); transition: transform .06s, box-shadow .06s, opacity .2s;
    margin-bottom: 6px;
  }
  button:active:not(:disabled) { transform: translateY(5px); box-shadow: 0 1px 0 var(--btn-edge); }
  button:disabled { opacity: .45; }
  button.secondary { background: rgba(255,255,255,.12); color: var(--text); box-shadow: 0 6px 0 rgba(0,0,0,.3); }
  button.secondary:active:not(:disabled) { box-shadow: 0 1px 0 rgba(0,0,0,.3); }
  .row { display: flex; gap: 10px; width: 100%; }
  .row > * { flex: 1; }
  .gap { height: 10px; }
  .or { color: var(--muted); margin: 8px 0 14px; font-size: 14px; }

  /* Game header */
  .topbar { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 14px; }
  .me .round { font-size: 22px; font-weight: 700; }
  .roomtag { font-size: 13px; color: var(--muted); margin-top: 2px; letter-spacing: 1px; }
  .opp {
    display: flex; align-items: center; gap: 10px;
    background: rgba(0,0,0,.25); border-radius: 40px; padding: 6px 14px 6px 6px;
    border: 1px solid rgba(255,255,255,.08); max-width: 60%;
  }
  .avatar {
    width: 46px; height: 46px; border-radius: 50%; flex: 0 0 46px;
    background: var(--felt); border: 3px solid var(--wood-light);
    display: flex; align-items: center; justify-content: center; transition: filter .3s, opacity .3s;
  }
  .avatar svg { width: 26px; height: 26px; }
  .avatar.off { filter: grayscale(1); opacity: .4; }
  .opp .info { min-width: 0; }
  .opp .oname { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .opp .opts { font-size: 20px; font-weight: 700; line-height: 1.1; }
  .opp .opts small { font-size: 12px; color: var(--muted); font-weight: 500; }

  /* Box */
  .box {
    width: 100%; background: linear-gradient(160deg, var(--wood-light), var(--wood) 60%, var(--wood-dark));
    border-radius: 14px; padding: 12px;
    box-shadow: 0 10px 24px rgba(0,0,0,.4), inset 0 2px 0 rgba(255,255,255,.12);
  }
  .felt {
    background: linear-gradient(120deg, var(--felt), var(--felt-light));
    border-radius: 6px; padding: 10px 8px 14px;
    box-shadow: inset 0 4px 10px rgba(0,0,0,.35);
  }
  .tiles { display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px; }
  .tile {
    aspect-ratio: 3 / 4.2; background: linear-gradient(90deg, #a68c85, var(--tile) 40%, #8d746d);
    color: var(--tile-text); border-radius: 4px;
    display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 800;
    box-shadow: 0 5px 0 var(--tile-edge); cursor: pointer;
    transition: transform .15s, background .15s, box-shadow .15s, opacity .15s;
    font-family: Georgia, "Times New Roman", serif;
  }
  .tile.sel { background: var(--highlight); transform: translateY(-5px); box-shadow: 0 10px 0 var(--tile-edge); }
  .tile.shut {
    background: var(--wood-dark); color: transparent; box-shadow: inset 0 4px 8px rgba(0,0,0,.5);
    transform: translateY(5px) scaleY(.9); cursor: default;
  }
  .tile.dim { opacity: .5; }
  .rail { height: 12px; margin: 12px 0 0; border-radius: 3px; background: linear-gradient(#8a6553, #6b4b3e); box-shadow: 0 3px 0 rgba(0,0,0,.3); }

  .dicearea { display: flex; gap: 18px; justify-content: center; align-items: center; margin: 22px 0 6px; min-height: 80px; }
  .die {
    width: 72px; height: 72px; background: #faf7f5; border-radius: 14px; display: grid;
    grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); padding: 10px;
    box-shadow: 0 6px 0 var(--btn-edge), 0 10px 18px rgba(0,0,0,.3);
  }
  .die.empty { background: rgba(255,255,255,.08); box-shadow: none; border: 2px dashed rgba(255,255,255,.22); }
  .die.rolling { animation: roll .45s ease-out; }
  @keyframes roll {
    0% { transform: rotate(-200deg) scale(.6); }
    70% { transform: rotate(15deg) scale(1.08); }
    100% { transform: rotate(0) scale(1); }
  }
  .pip { width: 13px; height: 13px; background: #2a2222; border-radius: 50%; align-self: center; justify-self: center; visibility: hidden; }
  .pip.on { visibility: visible; }
  .status { text-align: center; min-height: 26px; font-size: 18px; margin: 6px 0 0; color: var(--text); }
  .status b { color: var(--highlight); }
  .actions { width: 100%; margin-top: auto; padding-top: 18px; display: flex; flex-direction: column; gap: 10px; }

  .roundlist { width: 100%; display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-top: 8px; }
  .rcell { background: rgba(0,0,0,.22); border-radius: 8px; text-align: center; padding: 5px 0; font-size: 12px; color: var(--muted); }
  .rcell b { display: block; font-size: 16px; color: var(--text); }
  .rcell.cur { outline: 2px solid var(--felt-light); background: rgba(142,47,71,.35); }
  .totalbar {
    display: flex; justify-content: space-between; align-items: baseline; width: 100%;
    background: var(--wood); border-radius: 12px; padding: 10px 16px; box-shadow: 0 4px 0 var(--wood-dark);
  }
  .totalbar span { color: #e8d8cf; font-size: 15px; }
  .totalbar b { font-size: 26px; }

  /* Overlay */
  .overlay {
    position: fixed; inset: 0; background: rgba(20,14,30,.65); display: none; align-items: center; justify-content: center;
    padding: 24px; z-index: 10;
  }
  .overlay.show { display: flex; }
  .modal {
    background: linear-gradient(120deg, var(--felt), var(--felt-light)); border: 10px solid var(--wood); border-radius: 20px; padding: 24px;
    width: 100%; max-width: 360px; text-align: center; animation: pop .25s ease-out; box-shadow: 0 14px 30px rgba(0,0,0,.5);
  }
  @keyframes pop { from { transform: scale(.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .modal h2 { margin: 0 0 4px; font-size: 26px; font-weight: 700; }
  .modal .big { font-size: 64px; font-weight: 700; margin: 4px 0 18px; }
  .modal p { color: #f0dbe0; margin: -8px 0 18px; }
  .modal p:empty { display: none; }

  /* End screen */
  .vs { display: flex; width: 100%; gap: 12px; margin: 10px 0 18px; }
  .vs .side { flex: 1; background: rgba(0,0,0,.25); border-radius: 16px; padding: 16px 10px; text-align: center; }
  .vs .side.win { outline: 3px solid var(--highlight); background: rgba(142,47,71,.5); }
  .vs .name { font-size: 15px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .vs .pts { font-size: 44px; font-weight: 700; }
  .verdict { font-size: 26px; font-weight: 700; text-align: center; margin: 18px 0 4px; }
  .hint { font-size: 13px; color: var(--muted); text-align: center; margin-top: 8px; }
  table.rounds { width: 100%; border-collapse: collapse; font-size: 15px; margin-bottom: 4px; }
  table.rounds th, table.rounds td { padding: 6px; text-align: center; border-bottom: 1px solid rgba(255,255,255,.08); }
  table.rounds th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; }
  .toast {
    position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 20px); transform: translateX(-50%);
    background: rgba(0,0,0,.85); padding: 10px 16px; border-radius: 12px; font-size: 14px; opacity: 0;
    transition: opacity .25s; pointer-events: none; z-index: 20;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<div id="app">

  <!-- START -->
  <section class="screen active" id="sStart">
    <h1>Shut The Box</h1>
    <p class="sub">12er Version · 10 Runden · wenigste Punkte gewinnen</p>

    <div class="card">
      <label for="name">Dein Name</label>
      <input id="name" maxlength="14" placeholder="Name" autocomplete="off">
    </div>

    <div class="card">
      <button id="btnCreate">Raum erstellen</button>
      <div class="or" style="text-align:center">oder Raumcode eingeben</div>
      <input id="joinCode" maxlength="5" placeholder="CODE" autocomplete="off" autocapitalize="characters" spellcheck="false">
      <div class="gap"></div>
      <button id="btnJoin" class="secondary">Beitreten</button>
    </div>

    <div class="card" id="resumeCard" style="display:none">
      <button id="btnResume">Laufendes Spiel fortsetzen</button>
      <div class="hint" id="resumeInfo"></div>
    </div>

    <button id="btnSolo" class="secondary" style="margin-top:auto">Allein spielen (ohne Raum)</button>
  </section>

  <!-- GAME -->
  <section class="screen" id="sGame">
    <div class="topbar">
      <div class="me">
        <div class="round" id="roundLbl">Runde 1 / 10</div>
        <div class="roomtag" id="roomTag"></div>
      </div>
      <div class="opp" id="oppBox">
        <div class="avatar off" id="oppAvatar">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#f6efea" d="M12 2.5a3.6 3.6 0 0 1 2.2 6.45c1.2.75 2 2.08 2 3.55 0 .6-.13 1.17-.37 1.7L17.6 19H6.4l1.77-4.8a4.1 4.1 0 0 1-.37-1.7c0-1.47.8-2.8 2-3.55A3.6 3.6 0 0 1 12 2.5ZM5 20.2h14a1 1 0 0 1 1 1v.8H4v-.8a1 1 0 0 1 1-1Z"/></svg>
        </div>
        <div class="info">
          <div class="oname" id="oppName">Gegner</div>
          <div class="opts"><span id="oppTotal">–</span> <small id="oppRound"></small></div>
        </div>
      </div>
    </div>

    <div class="box"><div class="felt">
      <div class="tiles" id="tiles"></div>
      <div class="rail"></div>
      <div class="dicearea" id="dice"></div>
      <div class="status" id="status"></div>
    </div></div>

    <div class="actions">
      <button id="btnConfirm" style="display:none">Klappen schließen</button>
      <div class="row" id="rollRow">
        <button id="btnRoll">Würfeln</button>
        <button id="btnRoll1" class="secondary" style="display:none">1 Würfel</button>
      </div>
      <div class="roundlist" id="roundList"></div>
      <div class="totalbar"><span>Gesamt</span><b><span id="myTotal">0</span> <small style="font-size:14px;font-weight:500">Punkte</small></b></div>
    </div>
  </section>

  <!-- END -->
  <section class="screen" id="sEnd">
    <h1>Spielende</h1>
    <div class="verdict" id="verdict"></div>
    <div class="vs">
      <div class="side" id="sideMe"><div class="name" id="endMeName">Du</div><div class="pts" id="endMe">0</div></div>
      <div class="side" id="sideOpp"><div class="name" id="endOppName">Gegner</div><div class="pts" id="endOpp">–</div></div>
    </div>
    <div class="hint" id="endHint"></div>
    <div class="card" style="margin-top:14px">
      <table class="rounds" id="endTable"></table>
    </div>
    <div class="actions">
      <button id="btnRematch">Neues Spiel im selben Raum</button>
      <button id="btnHome" class="secondary">Zum Start</button>
    </div>
  </section>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <h2 id="mTitle"></h2>
    <div class="big" id="mBig"></div>
    <p id="mText"></p>
    <button id="mBtn">Weiter</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script>
(() => {
  'use strict';
  const ROUNDS = 10;
  const TILES = 12;
  const BROKER = 'wss://broker.emqx.io:8084/mqtt';
  const TOPIC_ROOT = 'dumbyphones/shutthebox/v1/';
  const LS_KEY = 'stb_state_v1';
  const LS_PROFILE = 'stb_profile_v1';

  const $ = id => document.getElementById(id);

  // ---------- persistence ----------
  function load(key, fallback) {
    try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch { return fallback; }
  }
  function save(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch {} }

  const profile = load(LS_PROFILE, null) || { id: Math.random().toString(36).slice(2, 10), name: '' };
  save(LS_PROFILE, profile);

  let S = load(LS_KEY, null); // game state
  const opponents = {}; // id -> data

  // ---------- helpers ----------
  function newCode() {
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    let c = '';
    for (let i = 0; i < 4; i++) c += chars[Math.floor(Math.random() * chars.length)];
    return c;
  }
  function freshGame(code, gameNo) {
    return {
      code, gameNo: gameNo || 1,
      round: 1, total: 0, scores: [],
      open: Array.from({ length: TILES }, () => true),
      dice: null, selected: [], phase: 'roll', finished: false,
    };
  }
  const sumOpen = () => S.open.reduce((a, o, i) => a + (o ? i + 1 : 0), 0);
  const diceSum = () => (S.dice || []).reduce((a, b) => a + b, 0);
  const selSum = () => S.selected.reduce((a, b) => a + b, 0);
  const highShut = () => [7, 8, 9, 10, 11, 12].every(n => !S.open[n - 1]);

  function canMake(target) {
    const nums = [];
    S.open.forEach((o, i) => { if (o) nums.push(i + 1); });
    const n = nums.length;
    for (let m = 1; m < (1 << n); m++) {
      let s = 0;
      for (let j = 0; j < n; j++) if (m & (1 << j)) { s += nums[j]; if (s > target) break; }
      if (s === target) return true;
    }
    return false;
  }
  // Is there a valid completion using currently selected + additional open tiles?
  function canComplete(selected, target) {
    const rest = target - selected.reduce((a, b) => a + b, 0);
    if (rest === 0) return true;
    if (rest < 0) return false;
    const nums = [];
    S.open.forEach((o, i) => { if (o && !selected.includes(i + 1)) nums.push(i + 1); });
    const n = nums.length;
    for (let m = 1; m < (1 << n); m++) {
      let s = 0;
      for (let j = 0; j < n; j++) if (m & (1 << j)) s += nums[j];
      if (s === rest) return true;
    }
    return false;
  }

  function toast(msg) {
    const t = $('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2200);
  }
  function show(screen) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    $(screen).classList.add('active');
  }
  function persist() { save(LS_KEY, S); publish(); }

  // ---------- networking (MQTT, retained score per player) ----------
  let client = null, connected = false, curRoom = null;

  function topicFor(code, id) { return TOPIC_ROOT + code + '/' + id; }

  function connect(code) {
    if (!code || typeof mqtt === 'undefined') { updateOpp(); return; }
    if (client && curRoom === code) return;
    if (client) { try { client.end(true); } catch {} }
    for (const k in opponents) delete opponents[k];
    curRoom = code;
    client = mqtt.connect(BROKER, {
      clientId: 'stb_' + profile.id + '_' + Math.random().toString(16).slice(2, 6),
      reconnectPeriod: 2000, connectTimeout: 8000, clean: true, keepalive: 30,
    });
    client.on('connect', () => {
      connected = true; updateOpp();
      client.subscribe(TOPIC_ROOT + code + '/+', { qos: 1 });
      publish();
    });
    client.on('close', () => { connected = false; updateOpp(); });
    client.on('offline', () => { connected = false; updateOpp(); });
    client.on('message', (topic, payload) => {
      const id = topic.split('/').pop();
      if (id === profile.id) return;
      if (!payload || !payload.length) { delete opponents[id]; updateOpp(); return; }
      try {
        const d = JSON.parse(payload.toString());
        if (Date.now() - (d.ts || 0) > 1000 * 60 * 60 * 24 * 3) return; // ignore stale (>3 days)
        opponents[id] = d;
        updateOpp();
        if (S && S.finished) renderEnd();
      } catch {}
    });
  }
  function disconnect() {
    if (client) { try { client.end(true); } catch {} }
    client = null; curRoom = null; connected = false;
    for (const k in opponents) delete opponents[k];
  }
  function publish() {
    if (!client || !connected || !S || !S.code) return;
    const data = {
      name: profile.name || 'Spieler', gameNo: S.gameNo, round: S.round, total: S.total,
      scores: S.scores, finished: S.finished, ts: Date.now(),
    };
    client.publish(topicFor(S.code, profile.id), JSON.stringify(data), { qos: 1, retain: true });
  }

  // Pick the opponent to display: same game number preferred, newest first
  function currentOpp() {
    const list = Object.values(opponents);
    if (!list.length) return null;
    list.sort((a, b) => ((b.gameNo === S.gameNo) - (a.gameNo === S.gameNo)) || (b.ts - a.ts));
    return list[0];
  }

  function updateOpp() {
    if (!S || !S.code) {
      $('oppBox').style.display = 'none';
      return;
    }
    $('oppBox').style.display = '';
    const o = currentOpp();
    $('oppAvatar').classList.toggle('off', !o || o.gameNo !== S.gameNo);
    if (!o) {
      $('oppName').textContent = connected ? 'Gegner' : 'verbinde…';
      $('oppTotal').textContent = '–';
      $('oppRound').textContent = '';
      return;
    }
    $('oppName').textContent = o.name;
    if (o.gameNo !== S.gameNo) {
      $('oppTotal').textContent = '–';
      $('oppRound').textContent = '';
      return;
    }
    $('oppTotal').textContent = o.total;
    $('oppRound').textContent = o.finished ? 'Pkt · fertig' : `Pkt · R${o.round}`;
  }

  // ---------- rendering ----------
  const PIPS = { 1: [4], 2: [0, 8], 3: [0, 4, 8], 4: [0, 2, 6, 8], 5: [0, 2, 4, 6, 8], 6: [0, 2, 3, 5, 6, 8] };
  function dieHTML(v, rolling) {
    if (!v) return '<div class="die empty"></div>';
    let h = `<div class="die${rolling ? ' rolling' : ''}">`;
    for (let i = 0; i < 9; i++) h += `<div class="pip${PIPS[v].includes(i) ? ' on' : ''}"></div>`;
    return h + '</div>';
  }

  function renderGame(rolling) {
    $('roundLbl').textContent = `Runde ${S.round} / ${ROUNDS}`;
    $('myTotal').textContent = S.total;
    $('roomTag').textContent = S.code ? 'Raum ' + S.code : 'Solo';

    // tiles
    const t = $('tiles'); t.innerHTML = '';
    const target = diceSum();
    S.open.forEach((o, i) => {
      const n = i + 1;
      const d = document.createElement('div');
      d.className = 'tile';
      d.textContent = n;
      if (!o) d.classList.add('shut');
      else if (S.selected.includes(n)) d.classList.add('sel');
      else if (S.phase === 'select' && !canComplete([...S.selected, n], target)) d.classList.add('dim');
      d.onclick = () => tapTile(n);
      t.appendChild(d);
    });

    // dice
    const dc = $('dice');
    if (S.dice) dc.innerHTML = S.dice.map(v => dieHTML(v, rolling)).join('');
    else dc.innerHTML = dieHTML(0) + dieHTML(0);

    // status & buttons
    const st = $('status');
    const conf = $('btnConfirm');
    const rollRow = $('rollRow');
    if (S.phase === 'roll') {
      st.innerHTML = S.dice ? 'Würfle weiter!' : 'Würfle, um die Runde zu starten.';
      conf.style.display = 'none';
      rollRow.style.display = '';
      $('btnRoll1').style.display = highShut() ? '' : 'none';
      $('btnRoll').textContent = highShut() ? '2 Würfel' : 'Würfeln';
    } else if (S.phase === 'select') {
      const rest = target - selSum();
      st.innerHTML = `Gewürfelt: <b>${target}</b>` + (S.selected.length ? ` · noch <b>${rest}</b>` : ' · wähle Klappen');
      rollRow.style.display = 'none';
      conf.style.display = '';
      conf.disabled = rest !== 0;
    } else {
      st.innerHTML = '';
      conf.style.display = 'none';
      rollRow.style.display = 'none';
    }

    // round list
    const rl = $('roundList'); rl.innerHTML = '';
    for (let r = 1; r <= ROUNDS; r++) {
      const c = document.createElement('div');
      c.className = 'rcell' + (r === S.round && !S.finished ? ' cur' : '');
      const v = S.scores[r - 1];
      c.innerHTML = `R${r}<b>${v === undefined ? '·' : v}</b>`;
      rl.appendChild(c);
    }
    updateOpp();
  }

  function renderEnd() {
    show('sEnd');
    const o = currentOpp();
    const sameGame = o && o.gameNo === S.gameNo;
    $('endMeName').textContent = profile.name || 'Du';
    $('endMe').textContent = S.total;
    $('sideMe').classList.remove('win'); $('sideOpp').classList.remove('win');
    const solo = !S.code;
    $('sideOpp').style.display = solo ? 'none' : '';
    $('btnRematch').textContent = solo ? 'Nochmal spielen' : 'Neues Spiel im selben Raum';

    let verdict = '', hint = '';
    if (solo) {
      verdict = S.total === 0 ? 'Perfekt! 0 Punkte 🎉' : `${S.total} Punkte`;
      hint = 'Weniger Punkte ist besser.';
    } else if (!sameGame) {
      $('endOppName').textContent = o ? o.name : 'Gegner';
      $('endOpp').textContent = '–';
      verdict = 'Warte auf Gegner…';
      hint = o ? 'Der Gegner ist in einem anderen Spiel.' : 'Noch kein Gegner im Raum ' + S.code + '.';
    } else {
      $('endOppName').textContent = o.name;
      $('endOpp').textContent = o.total;
      const diff = Math.abs(S.total - o.total);
      if (!o.finished) {
        verdict = S.total < o.total ? `Du liegst ${diff} vorne` : S.total > o.total ? `Du liegst ${diff} hinten` : 'Gleichstand';
        hint = `${o.name} spielt noch (Runde ${o.round} / ${ROUNDS}) – das Ergebnis aktualisiert sich live.`;
      } else if (S.total < o.total) {
        verdict = `Gewonnen! 🏆 (${diff} Punkte weniger)`; $('sideMe').classList.add('win');
      } else if (S.total > o.total) {
        verdict = `Verloren – ${diff} Punkte mehr`; $('sideOpp').classList.add('win');
      } else {
        verdict = 'Unentschieden!';
      }
      if (o.finished) hint = 'Weniger Punkte gewinnen.';
    }
    $('verdict').textContent = verdict;
    $('endHint').textContent = hint;

    // table
    let h = '<tr><th>Runde</th><th>' + esc(profile.name || 'Du') + '</th>' + (!solo && sameGame ? '<th>' + esc(o.name) + '</th>' : '') + '</tr>';
    for (let r = 0; r < ROUNDS; r++) {
      h += `<tr><td>${r + 1}</td><td>${S.scores[r] ?? '·'}</td>` +
        (!solo && sameGame ? `<td>${(o.scores || [])[r] ?? '·'}</td>` : '') + '</tr>';
    }
    h += `<tr><th>Summe</th><th>${S.total}</th>` + (!solo && sameGame ? `<th>${o.total}</th>` : '') + '</tr>';
    $('endTable').innerHTML = h;
  }
  function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

  function modal(title, big, text, btn, cb) {
    $('mTitle').textContent = title; $('mBig').textContent = big; $('mText').textContent = text;
    $('mBtn').textContent = btn;
    $('overlay').classList.add('show');
    $('mBtn').onclick = () => { $('overlay').classList.remove('show'); cb && cb(); };
  }

  // ---------- game actions ----------
  function roll(count) {
    if (S.phase !== 'roll') return;
    S.dice = Array.from({ length: count }, () => 1 + Math.floor(Math.random() * 6));
    S.selected = [];
    if (navigator.vibrate) navigator.vibrate(30);
    if (canMake(diceSum())) {
      S.phase = 'select';
      save(LS_KEY, S);
      renderGame(true);
    } else {
      S.phase = 'over';
      save(LS_KEY, S);
      renderGame(true);
      setTimeout(endRound, 900);
    }
  }

  function tapTile(n) {
    if (S.phase !== 'select' || !S.open[n - 1]) return;
    const i = S.selected.indexOf(n);
    if (i >= 0) S.selected.splice(i, 1);
    else {
      if (!canComplete([...S.selected, n], diceSum())) { toast('Passt nicht zur Augenzahl'); return; }
      S.selected.push(n);
    }
    save(LS_KEY, S);
    renderGame();
  }

  function confirmTiles() {
    if (S.phase !== 'select' || selSum() !== diceSum()) return;
    S.selected.forEach(n => { S.open[n - 1] = false; });
    S.selected = [];
    if (sumOpen() === 0) {
      S.phase = 'over';
      save(LS_KEY, S);
      renderGame();
      setTimeout(endRound, 300);
      return;
    }
    S.phase = 'roll';
    save(LS_KEY, S);
    renderGame();
  }

  function endRound() {
    const pts = sumOpen();
    S.scores[S.round - 1] = pts;
    S.total = S.scores.reduce((a, b) => a + b, 0);
    const last = S.round >= ROUNDS;
    S.phase = 'roundEnd';
    persist();
    renderGame();
    const title = pts === 0 ? 'Box geschlossen!' : 'Kein Zug möglich';
    modal(title, (pts === 0 ? '0' : '+' + pts), '', last ? 'Ergebnis ansehen' : 'Nächste Runde', () => {
      if (last) {
        S.finished = true; S.phase = 'done';
        persist();
        renderEnd();
      } else {
        S.round++;
        S.open = S.open.map(() => true);
        S.dice = null; S.selected = []; S.phase = 'roll';
        persist();
        renderGame();
      }
    });
  }

  // ---------- start screen ----------
  function getName() {
    const n = $('name').value.trim().slice(0, 14);
    if (!n) { toast('Bitte gib deinen Namen ein'); $('name').focus(); return null; }
    profile.name = n; save(LS_PROFILE, profile);
    return n;
  }
  function startGame(code) {
    S = freshGame(code);
    save(LS_KEY, S);
    if (code) connect(code); else disconnect();
    show('sGame');
    renderGame();
    publish();
    if (code) {
      modal('Raum erstellt', code, 'Teile diesen Code mit deinem Gegner. Ihr spielt jeder für euch – die Punkte des Gegners siehst du oben rechts.', 'Los geht\'s');
    }
  }
  function resumeGame() {
    if (S.code) connect(S.code); else disconnect();
    if (S.finished) { renderEnd(); return; }
    show('sGame');
    // If we reloaded mid-endRound, recompute
    if (S.phase === 'over' || S.phase === 'roundEnd') {
      if (S.scores[S.round - 1] === undefined) { S.phase = 'over'; renderGame(); endRound(); return; }
      // round already scored; continue to next
      if (S.round >= ROUNDS) { S.finished = true; S.phase = 'done'; persist(); renderEnd(); return; }
      S.round++; S.open = S.open.map(() => true); S.dice = null; S.selected = []; S.phase = 'roll'; persist();
    }
    renderGame();
  }

  $('name').value = profile.name || '';
  $('btnCreate').onclick = () => { if (getName()) startGame(newCode()); };
  $('btnJoin').onclick = () => {
    if (!getName()) return;
    const c = $('joinCode').value.trim().toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (c.length < 4) { toast('Bitte gültigen Raumcode eingeben'); return; }
    S = freshGame(c);
    save(LS_KEY, S);
    connect(c);
    show('sGame');
    renderGame();
    toast('Raum ' + c + ' beigetreten');
  };
  $('btnSolo').onclick = () => { if (getName()) startGame(null); };
  $('btnResume').onclick = resumeGame;
  $('btnRoll').onclick = () => roll(2);
  $('btnRoll1').onclick = () => roll(1);
  $('btnConfirm').onclick = confirmTiles;
  $('btnRematch').onclick = () => {
    const code = S.code; const g = (S.gameNo || 1) + 1;
    S = freshGame(code, g);
    // If opponent already started a newer game, sync to that number
    const o = Object.values(opponents).sort((a, b) => b.gameNo - a.gameNo)[0];
    if (o && o.gameNo > S.gameNo) S.gameNo = o.gameNo;
    persist();
    show('sGame');
    renderGame();
  };
  $('btnHome').onclick = () => {
    disconnect();
    S = null; save(LS_KEY, null);
    showStart();
  };

  function showStart() {
    show('sStart');
    if (S && !S.finished) {
      $('resumeCard').style.display = '';
      $('resumeInfo').textContent = (S.code ? 'Raum ' + S.code : 'Solo') + ` · Runde ${S.round} / ${ROUNDS} · ${S.total} Punkte`;
    } else if (S && S.finished) {
      $('resumeCard').style.display = '';
      $('btnResume').textContent = 'Letztes Ergebnis ansehen';
      $('resumeInfo').textContent = (S.code ? 'Raum ' + S.code : 'Solo') + ` · ${S.total} Punkte`;
    } else {
      $('resumeCard').style.display = 'none';
    }
  }

  // Allow ?room=CODE links
  const urlRoom = new URLSearchParams(location.search).get('room');
  if (urlRoom) $('joinCode').value = urlRoom.toUpperCase();

  if (S && !urlRoom) resumeGame(); else showStart();

  // Re-publish when coming back to foreground (iOS suspends sockets)
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && client && !client.connected) client.reconnect();
  });
})();
</script>
</body>
</html>
